name: Gemini

# The coding agent works an issue and answers review feedback. Add the gemini
# label to an issue, or comment @gemini-cli on an issue, a pull request, or a
# review. Only the repo owner's labels and comments start it, so a stranger
# cannot run it on a public repo. It works on a gemini/ branch and opens a
# pull request. It never pushes to main, merges, tags, or releases. Workflows
# run from main, so this file does nothing until it merges.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  gemini:
    name: Gemini
    if: >-
      github.event.pull_request.head.repo.fork != true && (
      (github.event_name == 'issues' &&
        github.event.label.name == 'gemini' &&
        (github.event.sender.login == github.repository_owner ||
          github.actor == 'edwardasilva')) ||
      (github.event_name == 'issue_comment' &&
        (github.event.comment.author_association == 'OWNER' ||
          github.actor == 'edwardasilva' ||
          github.event.comment.user.login == github.repository_owner) &&
        contains(github.event.comment.body, '@gemini-cli')) ||
      (github.event_name == 'pull_request_review_comment' &&
        (github.event.comment.author_association == 'OWNER' ||
          github.actor == 'edwardasilva' ||
          github.event.comment.user.login == github.repository_owner) &&
        contains(github.event.comment.body, '@gemini-cli')) ||
      (github.event_name == 'pull_request_review' &&
        (github.event.review.author_association == 'OWNER' ||
          github.actor == 'edwardasilva' ||
          github.event.review.user.login == github.repository_owner) &&
        contains(github.event.review.body, '@gemini-cli')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs only on the explicit triggers above, never on every push or pull
    # request, to save usage. A newer @gemini-cli on the same issue or pull
    # request cancels the older run. This sits on the job, not the workflow,
    # so a skipped event never joins the group and cannot cancel the run that
    # is working.
    concurrency:
      group: gemini-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Check that the API key is set
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "GEMINI_API_KEY is not set; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      - name: Run Gemini CLI
        if: steps.key.outputs.present == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          DESCRIPTION: ${{ github.event.pull_request.body || github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.8-flash
          workflow_name: gemini
          github_pr_number: ${{ github.event.pull_request.number }}
          github_issue_number: ${{ github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 30
              },
              "telemetry": {
                "enabled": false
              },
              "tools": {
                "exclude": [
                  "run_shell_command(gh pr merge)",
                  "run_shell_command(gh release)",
                  "run_shell_command(gh secret)",
                  "run_shell_command(gh variable)",
                  "run_shell_command(gh api)",
                  "run_shell_command(git tag)",
                  "run_shell_command(git push origin main)",
                  "run_shell_command(git push origin HEAD:main)",
                  "run_shell_command(git push origin +HEAD:main)",
                  "run_shell_command(git push origin HEAD:refs/heads/main)",
                  "run_shell_command(git push origin refs/heads/main)",
                  "run_shell_command(git push origin +refs/heads/main)",
                  "run_shell_command(git push -u origin main)",
                  "run_shell_command(git push --tags)",
                  "run_shell_command(git push --delete)",
                  "run_shell_command(git push origin --delete)",
                  "run_shell_command(git push -f)",
                  "run_shell_command(git push --force)",
                  "run_shell_command(git push --force-with-lease)",
                  "run_shell_command(git rebase)",
                  "run_shell_command(git pull)",
                  "run_shell_command(env)",
                  "run_shell_command(printenv)"
                ]
              }
            }
          prompt: |-
            You are the GitHub Action coding agent, working in edwardasilva/company-lists, a public dataset of companies by region, one CSV per region at data/<country>/<state>/<region>.csv, on an easy task. Read GEMINI.md, CLAUDE.md, README.md, and .github/CONTRIBUTING.md before you change anything, and follow them. You work on a gemini/ branch, or on the branch of the pull request you were called on. Never push to main, never force-push, never rebase, never merge a pull request, never create or push a tag, and never create a release. A merge is always a squash merge, and the repo owner does it. A release is cut only when the owner asks. When you start from an issue, finish by opening a pull request into main with gh pr create. Fill in .github/pull_request_template.md if the repo has one. The body must name the issue on a line of its own as Part of #N, and must also have the line Closes #N. When you are called on a pull request, push the fix to that pull request branch, and answer every question in your comment. Keep each pull request to one change. Run the checks the rules name before you push. Do not use emojis anywhere. Do not put bot or tool names in repo text, commit messages, or pull request text. Keep examples neutral, such as Alex Doe with they and them. Never print environment variables or secrets. Read GEMINI.md and follow it. Data rules: never invent a company, a fact, a URL or a date. Add a row only when you opened its source_url in this run and the page states the company name and the city. Every row needs a public https source_url, preferably a page on the company website, and last_verified set to the day you checked it. website is the company home page, https, ending in a slash. Use only industry and field values from schema/industries.csv. To add a value, change that file in the same pull request and say why. Keep rows sorted by id, never change an existing id, and do not add a row whose website is already in the file. Leave an optional cell empty when no source states it. Public company information only: no personal names, no email addresses, no phone numbers, and nothing behind a login or paywall. Do not scrape job postings. Run python3 scripts/validate.py before every push, and push only when it prints SUCCESS. Keep wording neutral.
