# Before a release, run this workflow and land or close every release-sweep issue.
name: Release cut

# Run by hand before cutting a release. Sweep the repo for release-blocking findings, open one
# release-sweep issue per finding, then fix each finding on its own claude/ branch. Never trigger
# this on a tag push or a release event. Issues opened with GITHUB_TOKEN do not start other
# workflows, so the sweep and the fixes live in this one file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read only: the sweep opens issues and reads pull requests, and never commits.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issues: ${{ steps.collect.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Record open release-sweep issues
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nums=$(gh issue list --label release-sweep --state open --limit 200 --json number --jq '[.[].number]')
          echo "nums=$nums" >> "$GITHUB_OUTPUT"

      - name: Sweep
        id: sweep
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: claude/
          settings: |
            {"effortLevel": "low"}
          prompt: |
            Run a release-cut sweep of this repository. Open one release-sweep issue per finding.
            Skip findings that already have an open release-sweep issue. Do not commit or open a pull request.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,LS,Bash(python3 scripts/validate.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh run view:*),Bash(gh run list:*),WebFetch,WebSearch"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh api:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin +HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push origin +HEAD:refs/heads/main:*),Bash(git push origin refs/heads/main:*),Bash(git push origin +refs/heads/main:*),Bash(git push origin +main:*),Bash(git push -u origin main:*),Bash(git push -u origin HEAD:main:*),Bash(git push -u origin HEAD:refs/heads/main:*),Bash(git push --tags:*),Bash(git push --delete:*),Bash(git push origin --delete:*),Bash(git push -f:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git pull:*),Bash(env:*),Bash(printenv:*)"
            --append-system-prompt 'You are running a release-cut sweep in company-lists. This job is read only: do not commit, push, open a pull request, merge, tag, or release. Sweep the whole repository, looking for bugs, broken links, stale docs, licensing and notice gaps, secrets or private data, and slop. For each distinct finding, open one GitHub issue with label release-sweep. Put file paths and line numbers in the issue body. Before opening an issue, list open issues with label release-sweep and skip any finding that already has one. Do not use emojis. Never print environment variables or secrets. When finished, stop. Do not open a pull request. Read and search files with the Read, Grep, and Glob tools, not shell commands. Run each allowed command plainly, without pipes, redirects, or command chaining.'

      # The execution log shows which tool calls were denied, if any. Kept for a week.
      - name: Upload the execution log
        if: always() && steps.sweep.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-execution
          path: ${{ steps.sweep.outputs.execution_file }}
          retention-days: 7

      - name: Collect new release-sweep issues
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.nums }}
        run: |
          after=$(gh issue list --label release-sweep --state open --limit 200 --json number --jq '[.[].number]')
          issues=$(jq -nc --argjson before "$BEFORE" --argjson after "$after" '$after - $before')
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "New release-sweep issues: $issues"

  fix:
    name: Fix #${{ matrix.issue }}
    needs: sweep
    if: needs.sweep.outputs.issues != '[]' && needs.sweep.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.sweep.outputs.issues) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fix issue
        id: fix
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: claude/
          settings: |
            {"effortLevel": "medium"}
          prompt: |
            Work issue #${{ matrix.issue }}. Read it with gh issue view. Fix the finding on a new claude/ branch cut from main, run the repo checks, and open one pull request into main. The body must have Part of #${{ matrix.issue }} and Closes #${{ matrix.issue }} on their own lines. Never merge, tag, or release.
          claude_args: |
            --model claude-opus-5-5
            --advisor claude-opus-5-5
            --allowedTools "Read,Glob,Grep,LS,Edit,MultiEdit,Write,Bash(python3 scripts/validate.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh run view:*),Bash(gh run list:*),WebFetch,WebSearch"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh api:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin +HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push origin +HEAD:refs/heads/main:*),Bash(git push origin refs/heads/main:*),Bash(git push origin +refs/heads/main:*),Bash(git push origin +main:*),Bash(git push -u origin main:*),Bash(git push -u origin HEAD:main:*),Bash(git push -u origin HEAD:refs/heads/main:*),Bash(git push --tags:*),Bash(git push --delete:*),Bash(git push origin --delete:*),Bash(git push -f:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git pull:*),Bash(env:*),Bash(printenv:*)"
            --append-system-prompt 'You are the Claude Code GitHub Action, working in edwardasilva/company-lists, a public dataset of companies by region, one CSV per region at data/<country>/<state>/<region>.csv. Read CLAUDE.md, README.md and .github/CONTRIBUTING.md before you change anything, and follow them. Work only on your own claude/ branch, or on the branch of the pull request you were called on. Never push to main, never force-push, never rebase, never merge a pull request, never create or push a tag, and never create a release. A merge is always a squash merge, and the repo owner does it. A release is cut only when the owner asks. When you start from an issue, finish by opening a pull request into main with gh pr create. Fill in .github/pull_request_template.md. The body must name the issue on a line of its own as Part of #N, and must also have the line Closes #N. When you are called on a pull request, push the fix to that pull request branch, and answer every question in your comment. Keep each pull request to one change. Data rules: never invent a company, a fact, a URL or a date. Add a row only when you opened its source_url in this run and the page states the company name and the city. Every row needs a public https source_url, preferably a page on the company website, and last_verified set to the day you checked it. website is the company home page, https, ending in a slash. Use only industry and field values from schema/industries.csv. To add a value, change that file in the same pull request and say why. Keep rows sorted by id, never change an existing id, and do not add a row whose website is already in the file. Leave an optional cell empty when no source states it. Public company information only: no personal names, no email addresses, no phone numbers, and nothing behind a login or paywall. Do not scrape job postings. Run python3 scripts/validate.py before every push, and push only when it prints SUCCESS. Do not use emojis anywhere. Keep wording neutral. Run commands plainly, without pipes or redirects, so they match the allowed list. Never print environment variables or secrets. On any change that touches more than one file or more than about 50 lines, consult the advisor before you start and before you open the pull request. Read and search files with the Read, Grep, and Glob tools, not shell commands. Run each allowed command plainly, without pipes, redirects, or command chaining.'

      # The execution log shows which tool calls were denied, if any. Kept for a week.
      - name: Upload the execution log
        if: always() && steps.fix.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-execution-${{ matrix.issue }}
          path: ${{ steps.fix.outputs.execution_file }}
          retention-days: 7
