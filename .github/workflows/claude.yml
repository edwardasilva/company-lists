name: Claude

# Claude Code works an issue and answers review feedback. The repo owner adds the claude label
# to an issue, or comments @claude on an issue, a pull request, or a review. Only the owner's
# label and comments start it, so a stranger cannot run it on this public repo. Claude works on a
# claude/ branch and opens a pull request. It never pushes to main, merges, tags, or releases.
# Workflows run from main, so this file does nothing until it merges.
on:
  # opened: a new issue from the owner with @claude in its title or body.
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: >-
      github.event.pull_request.head.repo.fork != true && (
      (github.event_name == 'issues' &&
        github.event.sender.login == github.repository_owner &&
        ((github.event.action == 'labeled' && github.event.label.name == 'claude') ||
          (github.event.action == 'opened' &&
            !contains(github.event.issue.labels.*.name, 'claude') &&
            (contains(github.event.issue.body, '@claude') ||
              contains(github.event.issue.title, '@claude'))))) ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == github.repository_owner &&
        contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs only on the explicit triggers above, never on every push or pull request, to save
    # usage. A newer @claude on the same issue or pull request cancels the older run. This sits
    # on the job, not the workflow, so a skipped event such as Claude's own progress comment
    # never joins the group and cannot cancel the run that is working.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # id-token lets the action trade the run's OIDC token for a Claude GitHub App token.
    # actions: read lets Claude read CI results on its pull requests.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The job condition covers review events. A comment on a pull request carries no
      # head repo, so this step checks it and stops on a pull request from a fork.
      - name: Refuse pull requests from forks
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          cross="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$cross" = "true" ]; then
            echo "::error::Claude does not run on pull requests from forks."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        env:
          # Subagents Claude starts run on Haiku.
          CLAUDE_CODE_SUBAGENT_MODEL: haiku
        with:
          # A Claude Max login made with `claude setup-token`, not an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          branch_prefix: claude/
          # Only the owner's comments and Claude's own reach Claude as context.
          include_comments_by_actor: ${{ github.repository_owner }},claude[bot]
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --advisor claude-opus-5-5
            --allowedTools "Bash(python3 scripts/validate.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh run view:*),Bash(gh run list:*),WebFetch,WebSearch"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh api:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin +HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push origin +HEAD:refs/heads/main:*),Bash(git push origin refs/heads/main:*),Bash(git push origin +refs/heads/main:*),Bash(git push origin +main:*),Bash(git push -u origin main:*),Bash(git push -u origin HEAD:main:*),Bash(git push -u origin HEAD:refs/heads/main:*),Bash(git push --tags:*),Bash(git push --delete:*),Bash(git push origin --delete:*),Bash(git push -f:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git pull:*),Bash(env:*),Bash(printenv:*)"
            --append-system-prompt 'You are the Claude Code GitHub Action, working in edwardasilva/company-lists, a public dataset of companies by region, one CSV per region at data/<country>/<state>/<region>.csv. Read CLAUDE.md, README.md and .github/CONTRIBUTING.md before you change anything, and follow them. Work only on your own claude/ branch, or on the branch of the pull request you were called on. Never push to main, never force-push, never rebase, never merge a pull request, never create or push a tag, and never create a release. A merge is always a squash merge, and the repo owner does it. A release is cut only when the owner asks. When you start from an issue, finish by opening a pull request into main with gh pr create. Fill in .github/pull_request_template.md. The body must name the issue on a line of its own as Part of #N, and must also have the line Closes #N. When you are called on a pull request, push the fix to that pull request branch, and answer every question in your comment. Keep each pull request to one change. Data rules: never invent a company, a fact, a URL or a date. Add a row only when you opened its source_url in this run and the page states the company name and the city. Every row needs a public https source_url, preferably a page on the company website, and last_verified set to the day you checked it. website is the company home page, https, ending in a slash. Use only industry and field values from schema/industries.csv. To add a value, change that file in the same pull request and say why. Keep rows sorted by id, never change an existing id, and do not add a row whose website is already in the file. Leave an optional cell empty when no source states it. Public company information only: no personal names, no email addresses, no phone numbers, and nothing behind a login or paywall. Do not scrape job postings. Run python3 scripts/validate.py before every push, and push only when it prints SUCCESS. Do not use emojis anywhere. Keep wording neutral. Run commands plainly, without pipes or redirects, so they match the allowed list. Never print environment variables or secrets. On any change that touches more than one file or more than about 50 lines, consult the advisor before you start and before you open the pull request.'

      # The action's progress comment links a Create PR page even when Claude opens the pull
      # request itself. This posts the real pull request link on the issue. If Claude pushed a
      # branch but opened no pull request, it says so and links the compare page instead.
      - name: Link the pull request on the issue
        if: >-
          !cancelled() && github.event.issue.number && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          posted="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body')"
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName,url \
            --jq "map(select(.headRefName | startswith(\"claude/issue-$ISSUE-\"))) | .[].url")"
          if [ -n "$prs" ]; then
            for url in $prs; do
              if ! grep -qF "$url" <<< "$posted"; then
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Pull request: $url"
              fi
            done
            exit 0
          fi
          branches="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/claude/issue-$ISSUE-" \
            --jq '.[].ref | sub("^refs/heads/"; "")')"
          for branch in $branches; do
            # A branch that already had a pull request, even a closed one, is an old run.
            had="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$branch" --json number --jq length)"
            if [ "$had" != "0" ]; then
              continue
            fi
            url="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
            if ! grep -qF "$url" <<< "$posted"; then
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                --body "Claude pushed $branch but opened no pull request. To open one: $url"
            fi
          done
